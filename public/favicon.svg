<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Center Radial Energy Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>

    <!-- Spark / Energy Dot Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Emerald Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Ambient Glow -->
  <rect width="512" height="512" rx="128" fill="url(#glowGrad)" />

  <!-- Subtle Beveled Inner Edge Highlight -->
  <rect
    x="12"
    y="12"
    width="488"
    height="488"
    rx="116"
    fill="none"
    stroke="#A7F3D0"
    stroke-width="10"
    stroke-opacity="0.35"
  />

  <!-- Stylized Geometric Energy Bolt -->
  <g filter="url(#boltShadow)">
    <path
      d="M288 64 L160 256 L248 256 L224 448 L352 224 L272 224 Z"
      fill="url(#boltGrad)"
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- Accent Energy Sparks (representing precision electrical calculation) -->
  <circle cx="368" cy="144" r="18" fill="url(#sparkGrad)" filter="url(#boltShadow)" />
  <circle cx="144" cy="368" r="10" fill="#6EE7B7" opacity="0.8" />
</svg>